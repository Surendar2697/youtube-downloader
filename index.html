<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="https://www.youtube.com/s/desktop/3ad23781/img/logos/favicon.ico" type="image/x-icon" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeInBody 1.5s ease-in;
    }

    @keyframes fadeInBody {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      overflow: hidden;
      animation: floatIn 1s ease forwards;
    }

    @keyframes floatIn {
      0% { transform: translateY(40px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .header {
      background: linear-gradient(45deg, #ff6b6b, #ee5a24);
      color: white;
      padding: 30px;
      text-align: center;
      animation: slideDown 1s ease-in-out;
    }

    @keyframes slideDown {
      0% { transform: translateY(-20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .header h1 {
      font-size: 2.5rem;
      animation: bounce 1s ease;
    }

    .header p {
      font-size: 1rem;
      opacity: 0.9;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .form-section {
      padding: 40px;
      animation: fadeIn 1s ease 0.5s;
      animation-fill-mode: both;
    }

    .input-group {
      margin-bottom: 25px;
      position: relative;
    }

    .input-group label {
      font-weight: 600;
      display: block;
      margin-bottom: 10px;
      color: #444;
    }

    .input-group input {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 8px rgba(102,126,234,0.4);
      outline: none;
    }

    .download-btn {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s ease;
    }

    .download-btn:hover {
      transform: scale(1.02);
    }

    .download-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      animation: fadeIn 0.6s ease-in-out;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ccc;
      border-top-color: #667eea;
      border-radius: 50%;
      margin: 0 auto 10px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-section {
      display: none;
      padding: 0 40px 40px;
      animation: fadeInUp 0.8s ease;
    }

    .video-info {
      background: #f9fafc;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 30px;
    }

    .video-info img {
      width: 100%;
      max-width: 300px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .video-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }

    .video-meta {
      color: #666;
      font-size: 0.95rem;
    }

    .download-options {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .option-group {
      background: #f1f3f5;
      border-radius: 10px;
      padding: 20px;
    }

    .option-group h3 {
      margin-bottom: 15px;
      color: #333;
      border-bottom: 2px solid #667eea;
      padding-bottom: 5px;
    }

    .download-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      transition: transform 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .download-item:hover {
      transform: scale(1.02);
    }

    .item-info {
      flex: 1;
    }

    .item-quality {
      font-weight: 600;
      color: #333;
    }

    .item-size {
      color: #666;
      font-size: 0.9rem;
    }

    .download-link {
      background: #28a745;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .download-link:hover {
      background: #1e7e34;
    }

    .error-message {
      display: none;
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .form-section, .result-section {
        padding: 30px 20px;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .video-title {
        font-size: 1.2rem;
      }

      .download-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .download-link {
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 YouTube Downloader</h1>
      <p>Download videos & audios easily from YouTube</p>
    </div>

    <div class="form-section">
      <div class="input-group">
        <label for="youtube-url">Paste YouTube URL</label>
        <input 
          type="url" 
          id="youtube-url" 
          placeholder="https://www.youtube.com/watch?v=..." 
          required
        />
      </div>
      <button class="download-btn" onclick="fetchVideoInfo()">Get Download Options</button>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Fetching video information...</p>
      </div>
      <div class="error-message" id="error-message"></div>
    </div>

    <div class="result-section" id="result-section">
      <div class="video-info" id="video-info"></div>
      <div class="download-options" id="download-options"></div>
    </div>
  </div>

  <script>
    // JS remains unchanged
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function formatDuration(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;
      return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
    }

    async function fetchVideoInfo() {
      const urlInput = document.getElementById('youtube-url');
      const loadingDiv = document.getElementById('loading');
      const errorDiv = document.getElementById('error-message');
      const resultSection = document.getElementById('result-section');
      const downloadBtn = document.querySelector('.download-btn');

      errorDiv.style.display = 'none';
      resultSection.style.display = 'none';

      const youtubeUrl = urlInput.value.trim();

      if (!youtubeUrl) return showError('Please enter a YouTube URL');

      const youtubeRegex = /^(https?:\/\/)?(www\.)?(youtube\.com\/(watch\?v=|shorts\/)|youtu\.be\/).+/;
      if (!youtubeRegex.test(youtubeUrl)) return showError('Invalid YouTube URL');

      loadingDiv.style.display = 'block';
      downloadBtn.disabled = true;

      try {
        const apiUrl = `https://yt-cw.fabdl.com/youtube/get?url=${encodeURIComponent(youtubeUrl)}&mp3_task=2`;
        const response = await fetch(apiUrl);

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const data = await response.json();

        if (data.result) {
          displayVideoInfo(data.result);
          displayDownloadOptions(data.result);
        } else {
          throw new Error('Invalid response format');
        }
      } catch (error) {
        console.error('Error fetching video info:', error);
        showError(`Error: ${error.message}`);
      } finally {
        loadingDiv.style.display = 'none';
        downloadBtn.disabled = false;
      }
    }

    function displayVideoInfo(videoData) {
      const videoInfoDiv = document.getElementById('video-info');
      videoInfoDiv.innerHTML = `
        <img src="${videoData.image}" alt="${videoData.title}" onerror="this.style.display='none'">
        <div class="video-title">${videoData.title}</div>
        <div class="video-meta"><strong>Channel:</strong> ${videoData.author}</div>
        <div class="video-meta"><strong>Duration:</strong> ${formatDuration(videoData.duration)}</div>
        <div class="video-meta"><strong>Video ID:</strong> ${videoData.id}</div>
      `;
    }

    function displayDownloadOptions(videoData) {
      const downloadOptionsDiv = document.getElementById('download-options');
      const resultSection = document.getElementById('result-section');
      let optionsHTML = '';

      if (videoData.videos?.length > 0) {
        optionsHTML += `<div class="option-group"><h3>📽️ Video Options</h3>`;
        videoData.videos.forEach(video => {
          optionsHTML += `
            <div class="download-item">
              <div class="item-info">
                <div class="item-quality">MP4 - ${video.quality}</div>
                <div class="item-size">${formatFileSize(video.filesize)} • ${video.has_audio ? 'With Audio' : 'No Audio'}</div>
              </div>
              <a href="${video.url}" class="download-link" download>Download</a>
            </div>`;
        });
        optionsHTML += `</div>`;
      }

      if (videoData.audios?.length > 0) {
        optionsHTML += `<div class="option-group"><h3>🎵 Audio Options</h3>`;
        videoData.audios.forEach(audio => {
          optionsHTML += `
            <div class="download-item">
              <div class="item-info">
                <div class="item-quality">${audio.type.toUpperCase()} Audio</div>
                <div class="item-size">${formatFileSize(audio.filesize)} • ${audio.quality} kbps</div>
              </div>
              <a href="${audio.url}" class="download-link" download>Download</a>
            </div>`;
        });
        optionsHTML += `</div>`;
      }

      downloadOptionsDiv.innerHTML = optionsHTML;
      resultSection.style.display = 'block';
    }

    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    document.getElementById('youtube-url').addEventListener('keypress', function(event) {
      if (event.key === 'Enter') fetchVideoInfo();
    });

    window.addEventListener('load', function () {
      document.getElementById('youtube-url').placeholder = 'e.g., https://www.youtube.com/watch?v=dQw4w9WgXcQ';
    });
  </script>
</body>
</html>

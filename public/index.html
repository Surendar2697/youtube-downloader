<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Downloader</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
</head>
<body>

<div class="bg-gradient"></div>

<!-- ── Full-screen download loader overlay ── -->
<div id="dlOverlay" class="dl-overlay hidden">
  <div class="dl-overlay-box">
    <div class="dl-spinner"></div>
    <p class="dl-overlay-title">Preparing download…</p>
    <p class="dl-overlay-sub">yt-dlp is fetching the stream.<br>Your browser will prompt you shortly.</p>
  </div>
</div>

<div class="container">

  <!-- ── Header ── -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">▶</span>
      <span class="logo-text">YT<span class="accent">Down</span></span>
    </div>
    <p class="tagline">Download YouTube videos in any format — fast &amp; free</p>
  </header>

  <!-- ── Search ── -->
  <section class="search-card card">
    <div class="input-group">
      <span class="input-icon">🔗</span>
      <input
        id="urlInput"
        type="url"
        placeholder="Paste YouTube URL here…"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="fetchBtn" class="btn btn-primary" onclick="fetchInfo()">
        <span class="btn-text">Fetch</span>
        <span class="btn-spinner hidden"></span>
      </button>
    </div>
    <div id="errorMsg" class="error-msg hidden"></div>
  </section>

  <!-- ── Video Info ── -->
  <section id="videoInfo" class="info-card card hidden">
    <div class="thumbnail-wrap" id="thumbWrap">
      <img id="thumbnail" src="" alt="thumbnail" />
      <div class="play-overlay">▶</div>
    </div>
    <div class="info-right">
      <h2 id="videoTitle" class="video-title"></h2>
      <p id="videoChannel" class="video-channel"></p>
      <p id="videoDuration" class="video-duration"></p>
    </div>
  </section>

  <!-- ── Format Picker ── -->
  <section id="formatSection" class="format-card card hidden">

    <div class="tabs">
      <button class="tab active" onclick="switchTab('video', this)">🎬 Video</button>
      <button class="tab"        onclick="switchTab('audio', this)">🎵 MP3</button>
    </div>

    <!-- Video tab -->
    <div id="videoTab" class="tab-content">
      <p class="section-label">Select Quality</p>
      <div id="qualityGrid" class="quality-grid"></div>

      <div class="options-panel">
        <label class="toggle-row">
          <span class="toggle-label">
            <span class="toggle-icon">🔇</span>
            Download <strong>without audio</strong>
          </span>
          <input type="checkbox" id="noAudioToggle" class="toggle-input" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div id="selectedQualityBadge" class="selected-badge hidden">
        Selected: <strong id="selectedQualityLabel"></strong>
      </div>

      <button id="downloadVideoBtn" class="btn btn-download" onclick="downloadNow('video')" disabled>
        ⬇&nbsp; Download Video
      </button>
    </div>

    <!-- Audio tab -->
    <div id="audioTab" class="tab-content hidden">
      <p class="section-label">Select Audio Quality</p>
      <div id="audioGrid" class="quality-grid"></div>

      <div id="selectedAudioBadge" class="selected-badge hidden">
        Selected: <strong id="selectedAudioLabel"></strong>
      </div>

      <button id="downloadAudioBtn" class="btn btn-download btn-audio" onclick="downloadNow('audio')" disabled>
        ⬇&nbsp; Download MP3
      </button>
    </div>

  </section>

  <!-- ── Footer ── -->
  <footer class="footer">
    <p>For personal use only · Respect YouTube's <a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">Terms of Service</a></p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
